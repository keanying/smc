# ===================================================================
# 景区社媒采集系统 —— 主配置文件
# 复制为 config/config.yaml 后按需修改；建议把 config.yaml 加入 .gitignore
#
# 配置优先级（后者覆盖前者）：
#   1. 代码内 DEFAULT_CONFIG（app/core/config.py）
#   2. 本文件 config/config.yaml
#   3. 环境变量 SMC_<段>_<键>，如 SMC_MYSQL_PASSWORD、SMC_PROXY_ENABLED
#      嵌套用双下划线：SMC_PLATFORMS__CTRIP__MAX_PAGES
# ===================================================================

server:
  host: 0.0.0.0
  port: 8000
  # 前端跨域来源；生产建议写成具体域名
  cors_origins: ["*"]
  log_level: INFO
  # 浏览器 profile、导出文件、下载媒体的根目录
  data_dir: "./data"

mysql:
  host: 127.0.0.1
  port: 3306
  user: root
  password: ""
  database: scenic_media
  charset: utf8mb4
  pool_min: 2
  pool_max: 20
  # 建表/迁移在服务启动时自动执行
  auto_migrate: true

redis:
  # 关掉后代理 IP 退化为进程内缓存（仅单进程有效），水印也会退化为内存集合
  enabled: true
  host: 127.0.0.1
  port: 6379
  db: 0
  username: ""
  password: ""
  ssl: false
  # Redis 6.0 以下必须为 2（不支持 HELLO 命令）
  protocol: 2
  key_prefix: "smc"
  # 采集水印：记录每个 景区+平台+关键字 上次采到的位置，支持增量采集
  watermark_ttl_days: 90
  # 去重位：已入库的 work_id / comment_id，避免重复写库
  dedupe_ttl_days: 30

proxy:
  enabled: false
  provider: kuaidaili
  # token=密钥令牌验证（推荐）；plain=SecretKey 明文
  auth_mode: token
  secret_id: ""
  secret_key: ""
  # 私密代理用户名/密码；都留空则走白名单模式
  username: ""
  password: ""
  min_ttl_seconds: 1200
  max_ttl_seconds: 1800
  # 提前多少秒弃用，避免踩到期
  safety_buffer_seconds: 30
  fetch_retries: 5
  # 新 IP 先验连通性再入库
  validate_on_fetch: true
  api_timeout_seconds: 10
  # >0 时每 N 次请求主动换一次 IP；0 = 仅按 TTL 与失败信号轮换
  rotate_every_n_requests: 0
  # channel = 每个平台各持有一个出口 IP，一个平台被封不牵连其他平台（推荐）
  # global  = 全平台共用一个出口 IP，省快代理提取次数
  pool_scope: channel
  # 平台级覆盖，例如给抖音单独关掉代理：
  # per_platform:
  #   douyin: { enabled: false }
  per_platform: {}

browser:
  # 浏览器引擎：playwright（默认，用 Playwright + Chromium）或 obscura（实验性，用 Obscura Rust 浏览器）
  # obscura 更轻量（30MB vs 200MB）、启动更快、内置反检测，但兼容性待验证
  engine: playwright
  # Obscura 配置（engine=obscura 时生效）
  obscura:
    # obscura serve 的端口
    port: 9223
    # 是否启用 stealth 模式（反检测 + 追踪器拦截）
    stealth: true
    # obscura 二进制路径，留空则自动从 PATH 找
    executable: ""
  # 同时最多开几个 Chromium。留空或 0 = 按机器内存自动推算。
  #
  # ⚠️ 这是整台机器最稀缺的资源，实测数据：
  #     一个 headless Chromium = 10 个进程 + 约 700MB（about:blank 就这么多，
  #     页面内容只再加几十兆；试过几套"省内存"启动参数，差异全在噪声里）
  #   所以 6 个并发 = 60 个进程 + 4.5GB，8 个 = 80 个进程 + 6GB。
  #   这个上限**和 scheduler.max_running_tasks 是两回事**：携程/同程/去哪儿
  #   是纯 HTTP 采集，不开浏览器，不占这里的名额。
  max_concurrent: 0
  # 可用内存低于这个数（GB）就先不开新浏览器，排队等着。
  # 内存见底之后再开浏览器，会把整机拖进换页——那时候所有任务一起变慢到超时，
  # 而且只能重启机器才能恢复。设成 0 关掉这道闸（不建议）。
  min_free_memory_gb: 1.0
  # 等浏览器名额/内存最多等多久（秒）。超时后会放行并打一条 ERROR 日志。
  capacity_wait_timeout_seconds: 600
  # 采集与「采集 Cookie」用不用无头（不弹窗口）
  headless: true
  # 交互式登录窗口用不用无头。默认 false（有头）：
  # 无头容易被平台风控拦掉，二维码也可能渲染不出来。
  # 服务跑在自己电脑上、不想被弹窗打扰时可以设成 true——画面通过推流照样看得到。
  headless_login: false
  # 留空 = 用 Playwright 自带 Chromium（首次需 playwright install chromium）
  # 也可指向系统已装的 Chrome，例如：
  #   Windows: C:\Program Files\Google\Chrome\Application\chrome.exe
  #   macOS:   /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
  executable_path: ""
  # 每个账号一个持久化目录，保存指纹与登录态，任务运行时静默复用
  profiles_dir: "./data/browser_profiles"
  stealth_js: "./backend/libs/stealth.min.js"
  default_timeout_ms: 60000
  slow_mo_ms: 0
  # 登录窗口保持在线的最长时间（秒），超时未完成登录则放弃
  login_timeout_seconds: 300
  # 静默校验登录态的间隔（秒）
  session_check_interval_seconds: 600
  # 后台每隔多少分钟自动采集一次各账号的 Cookie（0 = 关闭）。
  # 开着的话登录态会被持续刷新，不用等到任务跑起来才发现过期。
  auto_refresh_cookie_minutes: 0

crawl:
  # 单账号配额与冷却：别把一个账号用到被封。
  #
  # 平台判"机器号"看的不只是请求间隔（那个归下面的 pace 管），还看
  # **一个账号的总量和连续在线时长**。这两道闸任一超了，账号就进入冷却，
  # 挑账号时自动跳过，到期自动恢复。0 = 该项不限制。
  #
  # 三项都留空 = 按平台出厂默认（小红书最保守：150 条/天、45 分钟/次、
  # 冷却 180 分钟；抖音/快手 300 条、90 分钟；微博 500 条、120 分钟）。
  account_quota:
    enabled: true
    # 填了就全平台统一用这个值，会盖掉出厂默认
    # daily_works: 300
    # session_minutes: 90
    # cooldown_minutes: 120
    # 按平台单独覆盖
    per_channel: {}
    #   xiaohongshu:
    #     daily_works: 100
    #     session_minutes: 30
  # 新建任务时关键字数量上限（前端“从景区添加”默认一次带这么多）
  default_keyword_limit: 100
  # 以下是「全局默认」；新建/编辑任务时可以按平台单独覆盖，
  # 平台级设置优先于这里（见 params.channel_params）
  default_max_works: 100
  default_max_comments_per_work: 500
  # 携程/同程没有作品，只有景区点评：一个 POI 默认采多少条点评
  default_max_comments_per_poi: 1000
  collect_comments: true
  enable_sub_comments: true
  # 评论最深采集到几级：1=只要一级，2=一级+二级，以此类推
  max_comment_level: 3
  request_interval_seconds: 1.0
  page_interval_seconds: 1.0
  request_timeout_seconds: 25
  max_retries: 3
  # 单任务内并发采集的作品数
  concurrency: 2
  # 任务看门狗：运行超过多少分钟就取消（0 = 不限制，可以一直跑）。
  # 平台风控把连接挂住时，任务会永远卡在一个请求上，占着并发槽位。
  # ⚠️ 拟人模式很慢（一条笔记十几二十秒），200 条作品 × 多个关键字
  # 很容易超过 6 小时。要么把这里调大、要么设 0，
  # 但更该先看看是不是卡在"连续点不开卡片"上——那种情况下
  # 调大只是把空转时间拉长，采集器现在会自己放弃该关键字。
  task_timeout_minutes: 360
  # 单个关键字最多跑多少分钟，到点就换下一个关键字（0 = 不限）。
  # 一个景区通常配好几个关键字，不设预算的话第一个关键字卡住，
  # 后面的关键字一条都轮不上。建议 30~60。
  keyword_budget_minutes: 0

  # ---------------- 采集节奏（频率控制）----------------
  # 拟人采集慢是**故意的**——真人不会一秒点开五条视频。
  # 但"慢多少"应该能调：不同平台风控松紧不一样，
  # 同一个平台换个账号、换个时段容忍度也不一样。
  #
  # 三个档位，量级差一个数量级，所以必须分开：
  #   work_seconds   采完一条作品停多久再看下一条（拟人采集**主要**的等待）
  #   scroll_seconds 每次滚动之间（在循环里！一条作品能滚几十屏，
  #                  每屏多 0.5 秒就是多 20 秒）
  #   action_seconds 点击/输入这类小动作之间
  #
  # 嫌慢先调 work_seconds，还嫌慢再调 scroll_seconds。
  # 调太快的代价是更容易被风控盯上——被拦之后要重新登录，比慢更耗时间。
  #
  # 整段留空/删掉 = 用出厂默认（见 backend/app/core/pacing.py）：
  #   小红书 2~10s（风控最紧）  抖音 1.5~6s
  #   快手   1~5s              微博 0.8~3s
  #   滚动一律 0.6~1.2s，小动作 0.3~0.9s
  pace:
    default:
      work_seconds: [1.0, 8.0]
      scroll_seconds: [0.6, 1.2]
      action_seconds: [0.3, 0.9]
    xiaohongshu:
      work_seconds: [2.0, 10.0]
    douyin:
      work_seconds: [1.5, 6.0]
    kuaishou:
      work_seconds: [1.0, 5.0]
    weibo:
      work_seconds: [0.8, 3.0]
  # 已经在库里的评论要不要重写一遍。
  # 评论正文发出来就不会变，会变的只有点赞数；每天跑一轮的话，
  # 全量重写等于把几万行原样刷一遍，只为刷新老评论的赞数。
  # false = 只写新增（默认，写库量小很多）；true = 连老评论的赞数一起更新
  refresh_existing_comments: false

export:
  dir: "./data/exports"
  # 只支持 csv
  encoding: utf-8-sig
  chunk_size: 5000

scheduler:
  enabled: true
  timezone: Asia/Shanghai
  # 同时运行的任务数上限
  max_running_tasks: 3
  misfire_grace_seconds: 300

platforms:
  douyin:
    enabled: true
    need_login: true
  kuaishou:
    enabled: true
    need_login: true
  weibo:
    enabled: true
    need_login: true
  xiaohongshu:
    enabled: true
    need_login: true
  ctrip:
    enabled: true
    need_login: false
    page_size: 10
    max_pages: 300
    # 评论排序：1=默认
    sort_type: 1
  tongcheng:
    enabled: true
    need_login: false
    page_size: 10
    max_pages: 300
    lab_id: 6
    sort: 0
