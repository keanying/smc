# ============================================================================
# opinion_labeling_engine 标签体系（唯一真源）
# ----------------------------------------------------------------------------
# 需求 5.2.1 的「通用实体标签表」+「评价维度标签」在这里落地。
#
# 这份文件同时承担三个职责：
#   1. 生成提示词里给模型看的维度清单与实体清单（llm/prompt.py 读它）
#   2. 作为模型输出的白名单校验（labeling/postprocess.py 读它，非法路径直接丢弃）
#   3. 作为二期「标签维护」功能的数据底座（新增/编辑/停用 = 改这份 YAML）
#
# 约定：
#   - enabled: false 的条目仍保留在文件里（可追溯），但不进白名单、不进提示词
#   - dim3 为 null 表示该二级维度没有三级细分（如「排队时长」）
#   - positive / negative 关键词只是给模型的示例与规则兜底，不是穷举
# ============================================================================

version: "1.0"
updated_at: "2026-09-01"

# --- 情感枚举：与源表 sentiment_label / sentiment_score 严格对齐 ---------------
sentiment:
  # 标签字面值以线上样例数据为准（正向 / 中性 / 负向），不是需求文档里的「正面/负面」
  positive: 正向
  neutral: 中性
  negative: 负向
  scores:
    正向: 1
    中性: 0
    负向: -1
  # 模型可能吐出的同义写法，统一归一到上面三个值
  aliases:
    正面: 正向
    积极: 正向
    好评: 正向
    positive: 正向
    pos: 正向
    "1": 正向
    负面: 负向
    消极: 负向
    差评: 负向
    negative: 负向
    neg: 负向
    "-1": 负向
    中立: 中性
    一般: 中性
    neutral: 中性
    "0": 中性

# ============================================================================
# 一、评价维度标签（6 个一级维度）
# ============================================================================
dimensions:

  # -------------------------------------------------------------------- 游玩体验
  - dim1: 游玩体验
    desc: 游客对景区景观、项目、排队、价格感知的直接游玩感受
    children:
      - dim2: 景色观赏
        children:
          - dim3: 自然风光
            positive: [美, 漂亮, 壮观, 震撼, 如画, 仙境, 心旷神怡, 风景好, 景色优美]
            negative: [一般, 失望, 不美, 污染, 雾霾, 看不清, 光秃秃]
          - dim3: 人文景观
            positive: [有文化, 历史感, 古色古香, 底蕴, 有特色]
            negative: [人造, 商业化, 无感, 没意思, 太新]
          - dim3: 网红打卡点
            positive: [出片, 拍照好看, 打卡, 网红]
            negative: [照骗, 滤镜, 人太多, 排队拍照]
      - dim2: 项目活动
        children:
          - dim3: 游乐设施
            positive: [刺激, 好玩, 过瘾, 有趣, 嗨]
            negative: [无聊, 幼稚, 排队久, 设备旧]
          - dim3: 演艺表演
            positive: [精彩, 震撼, 好看, 感人]
            negative: [敷衍, 太短, 无聊, 音响差]
          - dim3: 互动体验
            positive: [沉浸, 参与感强, 有趣]
            negative: [没意思, 形式化, 单调]
      - dim2: 排队时长
        children:
          - dim3: null
            positive: [不排队, 很快, 顺畅, 效率高, 不用等]
            negative: [排队久, 等太久, 太慢, 队伍长, 拥堵]
      - dim2: 性价比
        children:
          - dim3: 门票价格
            positive: [值, 划算, 便宜, 优惠, 性价比高]
            negative: [太贵, 不值, 坑, 性价比低]
          - dim3: 二次消费
            positive: [合理, 透明, 自愿]
            negative: [乱收费, 强制消费, 捆绑, 隐形消费]

  # -------------------------------------------------------------------- 服务质量
  - dim1: 服务质量
    desc: 景区一线人员、导游、客服提供的服务
    children:
      - dim2: 工作人员
        children:
          - dim3: 态度
            positive: [热情, 亲切, 耐心, 微笑, 服务好]
            negative: [冷漠, 不耐烦, 态度差, 甩脸, 凶]
          - dim3: 专业度
            positive: [专业, 熟练, 解答清晰]
            negative: [不专业, 一问三不知, 业务不熟]
          - dim3: 响应速度
            positive: [及时, 迅速, 立马处理]
            negative: [拖拉, 处理慢, 半天没人]
      - dim2: 导游服务
        children:
          - dim3: 讲解水平
            positive: [讲解生动, 风趣, 有内涵, 讲得好]
            negative: [照本宣科, 敷衍, 听不清]
          - dim3: 路线安排
            positive: [路线合理, 紧凑, 不走回头路]
            negative: [路线混乱, 浪费时间, 绕路]
      - dim2: 客服响应
        children:
          - dim3: 电话咨询
            positive: [接通快, 解答详细]
            negative: [打不通, 占线, 无人接听]
          - dim3: 线上回复
            positive: [回复及时, 有帮助]
            negative: [回复慢, 自动回复, 答非所问]

  # -------------------------------------------------------------------- 设施环境
  - dim1: 设施环境
    desc: 景区硬件设施、环境卫生与智慧化设施
    children:
      - dim2: 基础设施
        children:
          - dim3: 厕所
            positive: [干净, 无异味, 数量充足, 有纸]
            negative: [脏乱, 排队, 没水, 没纸, 异味]
          - dim3: 休息区
            positive: [舒适, 充足, 遮阳]
            negative: [座椅少, 脏, 暴晒, 不够坐]
          - dim3: 导览标识
            positive: [清晰, 明确, 指引好]
            negative: [不清楚, 误导, 缺少, 找不到路]
      - dim2: 游玩设施
        children:
          - dim3: 索道电梯扶梯
            positive: [平稳, 舒适, 风景好]
            negative: [颠簸, 破旧, 危险, 排队久]
          - dim3: 游乐器械
            positive: [新颖, 安全, 好玩]
            negative: [老旧, 损坏, 暂停开放, 不安全]
      - dim2: 环境卫生
        children:
          - dim3: 整体清洁
            positive: [整洁, 干净, 一尘不染]
            negative: [垃圾遍地, 脏乱, 无人打扫]
          - dim3: 垃圾处理
            positive: [垃圾桶多, 及时清理]
            negative: [垃圾桶少, 溢出, 异味]
      - dim2: 智慧设施
        children:
          - dim3: WiFi
            positive: [网速快, 流畅, 覆盖好]
            negative: [连不上, 网速慢, 没信号]
          - dim3: 小程序APP
            positive: [好用, 方便, 功能全]
            negative: [卡顿, 闪退, 难用, 没信息]

  # -------------------------------------------------------------------- 餐饮购物
  - dim1: 餐饮购物
    desc: 园区内餐饮与商品零售
    children:
      - dim2: 餐饮
        children:
          - dim3: 食物口味
            positive: [好吃, 美味, 地道, 有特色]
            negative: [难吃, 味道一般, 不新鲜, 变质]
          - dim3: 价格
            positive: [实惠, 便宜, 性价比高]
            negative: [太贵, 天价, 宰客]
          - dim3: 卫生
            positive: [干净, 卫生]
            negative: [不干净, 有虫子, 拉肚子, 食物中毒]
      - dim2: 购物
        children:
          - dim3: 纪念品
            positive: [有特色, 精致, 喜欢]
            negative: [普通, 质量差, 义乌货]
          - dim3: 价格
            positive: [合理, 平价]
            negative: [太贵, 坑, 不值]

  # -------------------------------------------------------------------- 安全秩序
  - dim1: 安全秩序
    desc: 人身财产安全与现场秩序
    children:
      - dim2: 人身安全
        children:
          - dim3: 防护措施
            positive: [安全, 放心, 有护栏]
            negative: [危险, 没护栏, 隐患, 差点摔倒, 受伤]
          - dim3: 危险区域管理
            positive: [警示明显, 有人看管]
            negative: [无警示, 无人看管, 随便进]
      - dim2: 财产安全
        children:
          - dim3: 防偷防盗
            positive: [安心, 有巡逻]
            negative: [丢东西, 被偷, 小偷, 失窃]
      - dim2: 秩序维护
        children:
          - dim3: 人流疏导
            positive: [有序, 疏导及时]
            negative: [拥挤, 堵塞, 踩踏隐患, 人挤人]
          - dim3: 应急处理
            positive: [处理迅速, 有预案]
            negative: [无人管, 反应慢, 混乱]

  # -------------------------------------------------------------------- 交通接驳
  - dim1: 交通接驳
    desc: 到达景区的外部交通与园区内部通行
    children:
      - dim2: 外部交通
        children:
          - dim3: 抵达便利性
            positive: [方便, 直达, 公交地铁方便]
            negative: [偏远, 交通不便, 没车]
          - dim3: 停车场
            positive: [车位多, 好停]
            negative: [车位少, 停车场远, 收费高]
      - dim2: 内部交通
        children:
          - dim3: 摆渡车观光车
            positive: [准时, 频次高, 方便]
            negative: [等太久, 班次少, 路线不合理]
          - dim3: 内部步行
            positive: [路好走, 距离短]
            negative: [太累, 太远, 路不好走]

# ============================================================================
# 二、通用实体标签表
# ============================================================================
entities:

  - type: 游客类型
    values:
      - {name: 亲子家庭, keywords: [孩子, 宝宝, 亲子, 儿童, 家庭, 带娃, 推车, 母婴]}
      - {name: 情侣夫妻, keywords: [情侣, 二人世界, 老公, 老婆, 约会, 夫妻]}
      - {name: 朋友结伴, keywords: [朋友, 闺蜜, 兄弟, 聚会, 同行, 朋友出游]}
      - {name: 独自旅行, keywords: [一个人, 独自, 独行, 单身]}
      - {name: 老年游客, keywords: [老人, 退休, 父母, 腿脚不便, 老年]}
      - {name: 商务游客, keywords: [出差, 会议, 工作, 商务]}

  - type: 景点项目
    values:
      - {name: 自然景点, keywords: [山峰, 湖泊, 瀑布, 森林, 峡谷, 溶洞]}
      - {name: 人文景观, keywords: [古建筑, 寺庙, 博物馆, 雕塑, 古镇]}
      - {name: 游乐项目, keywords: [过山车, 摩天轮, 漂流, 索道, 蹦极, 滑道]}
      - {name: 演艺表演, keywords: [演出, 剧场, 灯光秀, 巡游, 表演]}
      - {name: 网红打卡点, keywords: [玻璃栈道, 天空之镜, 网红桥, 打卡点]}

  - type: 设施设备
    values:
      - {name: 基础设施, keywords: [厕所, 卫生间, 洗手间, 停车场, 休息区, 游客中心, 母婴室]}
      - {name: 游玩设施, keywords: [观光车, 缆车, 电梯, 步道, 扶梯]}
      - {name: 智慧设施, keywords: [wifi, 无线, 小程序, APP, 电子导览, 扫码]}
      - {name: 标识系统, keywords: [指示牌, 路标, 导览图, 标识, 地图]}

  - type: 工作人员
    values:
      - {name: 岗位, keywords: [导游, 检票员, 保安, 保洁, 售票员, 工作人员, 服务员]}
      # 需求注明「本期暂不涉及」，保留定义但停用
      - {name: 具体人员, keywords: [], enabled: false}

  - type: 餐饮商品
    values:
      - {name: 餐饮品类, keywords: [面条, 米粉, 米饭, 小吃, 饮料, 雪糕, 矿泉水]}
      - {name: 具体商品, keywords: [牛肉面, 烤肠, 纪念T恤, 冰箱贴, 钥匙扣]}
      - {name: 餐厅名称, keywords: [], enabled: false}

  - type: 时间事件
    values:
      - {name: 节假日, keywords: [五一, 国庆, 春节, 周末, 小长假, 黄金周, 清明, 中秋, 过年]}
      - {name: 特殊事件, keywords: [雨天, 下雨, 下雪, 旺季, 淡季, 活动期间]}
      - {name: 时间段, keywords: [早上, 上午, 下午, 晚上, 白天, 夜间]}

  - type: 地理位置
    values:
      - {name: 出入口, keywords: [大门, 南门, 北门, 出口, 入口, 检票口]}
      - {name: 区域, keywords: [山顶, 山脚, 湖边, 核心区, 游览区]}
      - {name: 路段, keywords: [上山路, 下山路, 栈道, 台阶, 斜坡]}

  - type: 票务类型
    values:
      - {name: 门票, keywords: [成人票, 儿童票, 学生票, 老人票, 优待票]}
      - {name: 套票, keywords: [套票, 联票, 通票, 组合票]}
      - {name: 其他, keywords: [年卡, 季卡, VIP, 快速通道]}

  # 开放取值类型：景区/景点专名无法枚举，由模型从原文中抽取，
  # 白名单只校验 type，不校验 value（线上样例 {"type":"景区地名","value":"瑶琳仙境"} 即此类）
  - type: 景区地名
    open_value: true
    values: []

# ============================================================================
# 三、关键词黑名单：这些词即使模型吐出来也不进 keyword_tags
# 用于兜住「幻觉 / 无信息量」的情况（需求要求 4）
# ============================================================================
keyword_blacklist:
  # 无信息量的通用词
  - 景区
  - 地方
  - 东西
  - 感觉
  - 时候
  - 可以
  - 没有
  - 就是
  - 我们
  - 自己
  - 这个
  - 那个
  - 什么
  - 因为
  - 所以
  - 但是
  - 不过
  - 还有
  - 一下
  - 一些
  - 非常
  - 真的
  - 特别
  - 比较
  - 有点
  - 一点
  # 模型常见的元话术
  - 无
  - 暂无
  - 未提及
  - 不适用
  - null
  - none
  - N/A
