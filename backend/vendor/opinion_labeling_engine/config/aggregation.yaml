# ============================================================================
# 关键词聚合词典：把同义的关键词归并到一个「归类关键词」
# ----------------------------------------------------------------------------
# 解决的问题：模型抽出来的 keyword_tags 是原文表述，同一个意思有无数种写法——
#     人太多 / 人多 / 人山人海 / 人太多了 / 人挤人 / 乌泱泱
# 做词云、做 TOP 榜、做趋势时它们被算成了不同的词，一个真正的高频问题
# 被切成了十几个低频词，榜上根本看不见。
#
# 为什么用字典而不是让模型直接输出归类词：
#     这件事的全部价值就在**一致**。模型每次可能给「人多」「人流量大」「拥挤」，
#     那还是没归并。字典是确定性的：同样的输入永远得到同样的输出，
#     改了词典重跑一遍，历史数据也能跟着变，而且**不用再调一次模型**。
#
# ---------------------------------------------------------------------------
# dim：这一组挂在维度树的哪个节点上
# ---------------------------------------------------------------------------
# 每组都标了 dim（对应 taxonomy.yaml 的 dim1/dim2/dim3）。它不参与匹配，
# 作用是让 aggregation_keyword_tags 和 dimension_tags 能对上：
# 看板上点「排队久」这个归类词，可以直接下钻到「游玩体验/排队时长」这个维度，
# 两套标签不再是各说各话的两张皮。
# 整体倾向类（开心、值得再来、失望……）不挂维度，dim 留空。
#
# 词表主要来源就是你给的那张「维度 × 情感 × 典型关键词 × 正则」表，
# 每个「三级属性 + 情感」单元格基本对应这里的一个归类词。
#
# ---------------------------------------------------------------------------
# 匹配规则（见 domain/aggregation.py）
# ---------------------------------------------------------------------------
#     1. 全角转半角、去空格、去标点、转小写后比对
#     2. 先精确命中 synonyms，再按 contains 命中（长的优先，避免「人多」抢走「人山人海」）
#     3. patterns 写正则，处理「排队.*小时」这类穷举不完的构造
#     4. **否定守卫**：命中位置往前看 3 个字，被「不/没/无/免/别」否定掉的不算命中。
#        没有这条，「不好吃」会同时进「东西好吃」和「东西难吃」，好评倒挂进负面榜。
#        （「无敌好看」「不虚此行」这类假否定有白名单，不会误伤。）
#     5. exclude 写正则，一票否决——守卫兜不住的反例，如「人少」不进「人多拥挤」
#     6. 一个关键词可以命中多个归类词（如"排队两小时人还特别多"）
#     7. 一个都没命中 → 不进 aggregation_keyword_tags，并被
#        `python scripts/backfill_aggregation.py --report` 按频次统计出来，
#        看频次决定要不要往词典里加。**扩词典就看这份报告，不要凭空想。**
#
# ---------------------------------------------------------------------------
# 维护约定
# ---------------------------------------------------------------------------
#     - synonyms 尽量 ≥2 个字。单字同义词会在包含匹配里到处乱命中。
#     - 正负两组词之间要么靠否定守卫分开，要么给其中一组写 exclude。
#     - 加完词跑 `python -m pytest tests/test_aggregation.py -q` 再上线：
#       里面有一条用例会把**全部同义词**过一遍匹配，发现"正向词命中了负向组"
#       就直接失败，这是这份词典最重要的一道护栏。
#     - 改完词典重跑 `python scripts/backfill_aggregation.py`，历史数据跟着变，
#       一次模型调用都不用。
#
# polarity 只用于校验与报表，不参与匹配。
# ============================================================================

