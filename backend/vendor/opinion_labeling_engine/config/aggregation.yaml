# ============================================================================
# 一个需要你拍板的取舍
# ----------------------------------------------------------------------------
# 你举例时把「排队」和「人多、拥挤、人山人海、爆满、人潮」列在了一起。
# 我把 **排队久** 拆成了独立的一组，没有并进 **人多拥挤**，理由：
#
#   你们自己的维度体系里，「排队时长」是 游玩体验 下独立的二级维度，
#   和「人多」不是一回事——园区人多但分流好、不用排队是常见情况，
#   淡季人不多但只开一个检票口照样排长队也很常见。
#   并成一组之后，"排队" 这个能直接指向运营动作（加检票口、放预约）的信号
#   就被"人多"这个没法直接行动的描述淹没了。
#
# 如果你们的看板就是想把它们看成一件事，把 排队久 那一组的 synonyms
# 剪切进 人多拥挤 即可，改完重跑一次回填脚本，历史数据会跟着变，不花模型钱。
#
# 同理，「人多拥挤」我挂在 安全秩序/秩序维护/人流疏导 而不是
# 游玩体验/景色观赏/网红打卡点——你给的表里两处都有"人多"，
# 但只有挂在人流疏导下面，这个词才对得上"该加引导员/该限流"的运营动作。
# ============================================================================
