  - canonical: 人多拥挤
    polarity: 负向
    dim: 安全秩序/秩序维护/人流疏导
    synonyms: [人多, 人太多, 人很多, 人超多, 人巨多, 人爆多, 人真多, 人非常多,
               人好多, 人特别多, 人流量大, 客流大, 游客多, 人山人海, 人挤人,
               挤爆, 拥挤, 很挤, 太挤, 挤死, 挤不动, 摩肩接踵, 乌泱泱, 乌压压,
               人潮, 人潮汹涌, 人满为患, 爆满, 人头攒动, 到处都是人, 全是人,
               下饺子, 看人头, 人比景多, 走都走不动, 寸步难行, 水泄不通,
               堵塞, 堵得走不动, 踩踏, 踩踏隐患, 人流大, 限流了]
    patterns: ['人[^不没无少]{0,3}多', '挤']
    exclude: ['人少', '人不多', '人不算多', '没什么人', '不拥挤', '不算挤', '不怎么挤']

