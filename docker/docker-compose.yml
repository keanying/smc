# 一键启动：docker compose -f docker/docker-compose.yml up -d
# 首次启动会自动建库建表，无需手工执行 SQL。
name: scenic-media-collector

services:
  mysql:
    image: mysql:8.0
    container_name: smc-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-smc_root_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-scenic_media}
      MYSQL_USER: ${MYSQL_USER:-smc}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-smc_pass}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      # 采集是批量写入，放宽单包上限
      - --max_allowed_packet=64M
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-smc_root_pass}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: smc-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: smc-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 环境变量优先级高于 config.yaml，容器里连的是服务名而不是 127.0.0.1
      SMC_MYSQL_HOST: mysql
      SMC_MYSQL_PORT: 3306
      SMC_MYSQL_USER: ${MYSQL_USER:-smc}
      SMC_MYSQL_PASSWORD: ${MYSQL_PASSWORD:-smc_pass}
      SMC_MYSQL_DATABASE: ${MYSQL_DATABASE:-scenic_media}
      SMC_REDIS_HOST: redis
      SMC_REDIS_PORT: 6379
      SMC_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SMC_SERVER_PORT: 8000
      TZ: Asia/Shanghai
    volumes:
      # config.yaml 挂进去，改完重启容器即可生效
      - ../config:/app/config
      # 采集数据、浏览器 profile、导出文件持久化到宿主机
      - ../data:/app/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    # 交互式登录要开有头浏览器，共享内存太小会崩
    shm_size: 1gb

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: smc-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  mysql_data:
  redis_data:
