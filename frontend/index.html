<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      ⚠️ 不发 Referer。各平台的图片 CDN（微博的 sinaimg、抖音的 douyinpic、
      小红书的 xhscdn）都做了防盗链：请求里带着别的站点的 Referer 就回 403。
      表现非常具有迷惑性——把图片地址复制到浏览器地址栏能正常打开
      （那样不带 Referer），可页面里就是一片"加载失败"，
      让人以为是采到的地址不对。
      加这一行之后浏览器对所有外链资源都不发 Referer，图片就能显示了。
    -->
    <meta name="referrer" content="no-referrer" />
    <!--
      标签页图标：用 LOGO 原图等比缩放、居中放进正方形透明底生成（PNG + ICO，Safari 不认 SVG 图标）。
      ⚠️ 地址带 ?v=：浏览器对图标缓存得特别死，换了 LOGO 不改地址，用户那边会一直显示旧图标。
      以后再换 LOGO，重新生成这几个文件，并把 v 加 1。
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png?v=3" />
    <link rel="shortcut icon" href="/favicon.ico?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <title>CloudSense · 云听社媒舆情分析</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
